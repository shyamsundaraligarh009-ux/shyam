<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style  type="text/css">
        header{
            display: flex;
            justify-content: space-between;
            margin-left: 10px;
            margin-right: 10px;
            margin-top: 20px;
        }
        .title{
            font-size: larger;
            text-decoration: solid;
            
            color: rgb(234, 22, 22);
            
        }
        article{
            background-color: black;
            color: aliceblue;
            margin-top: 10px;
        }
        .hello{
            padding-left: 10px;
        }
        .pk{
            text-decoration: underline;
            color: brown;
        }
        sup{
            color: white;
            background-color: rgb(245, 10, 10);
            border-radius: 50%;
            padding: 5px;
            font-size: 10px;
        }

        .bi.bi-lightning-fill{

            
            color:darkgoldenrod;
            
        }
        marquee{
            margin-top: 10px;
        }

    </style>
</head>
<body>
    <header>
        <div class="title">
            Shopper

        </div>

        
        <div class="hello">
            <span class="pk">Home</span>
            <span>Blog</span>
            <span>Catalog</span>
            <span>Shop</span>
            <span>Elements</span>
        </div>
        <div>
            <span class="bi bi-search"></span>
            <span class="bi bi-person"></span>
            <span class="bi bi-suit-heart"></span>
            <span class="bi bi-cart"></span><sup>2</sup>
        </div>
    </header>
    <article>
        <marquee>
            <span class="bi bi-lightning-fill"></span>
            <span>Happy Holidy Deal on Everthing</span>
            <span class="bi bi-lightning-fill"></span>
        </marquee>
    </article>
</body>
</html>
